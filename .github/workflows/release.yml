name: Release gate

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: every required suite has passing evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate compares each evidence commit with HEAD, so it needs the history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Release gate
        run: make release-gate

  catalog-scale:
    name: catalog load (cold and incremental, both Engine DBs)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ETL_CRAFT_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Check cold and incremental catalog budgets
        run: uv run pytest -q -x -p no:cacheprovider tests/acceptance/catalog_scale.py --junitxml=catalog-scale.xml
      - name: Upload timings and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-scale
          path: catalog-scale.xml
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color postgres
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

  chaos:
    name: chaos (${{ matrix.engine }}, 20 consecutive runs)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        engine: [engine_sqlite, engine_postgres]
    env:
      ETL_CRAFT_REQUIRE_SERVICES: "1"
      CHAOS_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Start local services
        run: make services-up
      - name: Require twenty consecutive passes
        run: |
          mkdir -p chaos-results
          for iteration in {1..20}; do
            echo "Chaos iteration $iteration/20 ($CHAOS_ENGINE)"
            uv run pytest -q -x -m "chaos and $CHAOS_ENGINE" --junitxml="chaos-results/iteration-$iteration.xml"
          done
      - name: Upload iteration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-${{ matrix.engine }}
          path: chaos-results/
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local services
        if: always()
        run: make services-down

  python-platform:
    name: complete Python / OS compatibility (${{ matrix.python }}, ${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --python '${{ matrix.python }}'
      - name: Run every test applicable without local services
        run: uv run pytest -q -n logical --dist worksteal --junitxml=python-platform.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-platform-${{ matrix.python }}-${{ matrix.os }}
          path: python-platform.xml

  images:
    name: Build and smoke-test tagged deployment images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Verify the tag matches the package
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:rc\d+)?", tag) or tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} must match package version {version!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Build images from the repository wheel
        env:
          ETL_CRAFT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/etl-craft/etl-craft:$ETL_CRAFT_VERSION"
          docker build --target base --tag "$image" .
          docker build --target ui --tag "$image-ui" .
      - name: Install pinned k3d and kubectl
        run: |
          tools="$RUNNER_TEMP/deployment-bin"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 \
            --output "$tools/k3d"
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl --output "$tools/kubectl"
          (
            cd "$tools"
            sha256sum -c <<'SHA'
          06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  k3d
          4f6a959dcc5b702135f8354cc7109b542a2933c46b808b248a214c1f69f817ea  kubectl
          SHA
          )
          chmod +x "$tools/k3d" "$tools/kubectl"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Exercise the Compose and Kubernetes examples
        env:
          ETL_CRAFT_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/deployment/smoke.sh --k3d
      - name: Save exactly the tested images
        env:
          ETL_CRAFT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/etl-craft/etl-craft:$ETL_CRAFT_VERSION"
          docker save -o deployment-images.tar "$image" "$image-ui"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-images
          path: deployment-images.tar
          retention-days: 1
          if-no-files-found: error

  publish-images:
    name: Publish tested images to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, catalog-scale, chaos, python-platform, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deployment-images
      - name: Push only the exact version tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ETL_CRAFT_VERSION: ${{ needs.images.outputs.version }}
        run: |
          image="ghcr.io/etl-craft/etl-craft:$ETL_CRAFT_VERSION"
          docker load -i deployment-images.tar
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$image"
          docker push "$image-ui"
