x-backend: &backend
  image: ghcr.io/etl-craft/etl-craft:${ETL_CRAFT_VERSION:?Set ETL_CRAFT_VERSION}
  environment:
    ENGINE_PASSWORD: ${ENGINE_PASSWORD:?Set ENGINE_PASSWORD}
    ETL_CRAFT_TOKEN: ${CONTROLLER_TOKEN:-}
  read_only: true
  volumes:
    - project:/project
    - ./engine.yml:/project/craft-connector.yml:ro
  tmpfs: ["/tmp:mode=1777", "/state:uid=10001,gid=10001,mode=0700"]
  networks: [backend]
  depends_on:
    postgres: {condition: service_healthy}
  expose: ["8730"]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8730/health', timeout=3).close()"]
    interval: 5s
    timeout: 4s
    retries: 12
  stop_grace_period: 65s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: etl_craft
      POSTGRES_USER: etl_craft
      POSTGRES_PASSWORD: ${ENGINE_PASSWORD:?Set ENGINE_PASSWORD}
    networks: [backend]
    volumes: [engine:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, etl_craft, -d, etl_craft]
      interval: 3s
      timeout: 3s
      retries: 20
  controller:
    <<: *backend
    command: [controller, --no-ui]
  ui:
    <<: *backend
    image: ghcr.io/etl-craft/etl-craft:${ETL_CRAFT_VERSION:?Set ETL_CRAFT_VERSION}-ui
    command: [ui]
    networks: [backend, edge]
    deploy:
      replicas: 2
  proxy:
    image: nginx:stable-alpine
    depends_on:
      ui: {condition: service_healthy}
    ports: ["127.0.0.1:${ETL_CRAFT_HTTPS_PORT:-8443}:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks:
      edge:
        aliases: [etl-craft.test]
        ipv4_address: 172.28.87.254
  agent:
    image: ghcr.io/etl-craft/etl-craft:${ETL_CRAFT_VERSION:?Set ETL_CRAFT_VERSION}
    command: [agent]
    environment:
      ETL_CRAFT_API: https://etl-craft.test
      ETL_CRAFT_TOKEN: ${AGENT_TOKEN:-}
      SSL_CERT_FILE: /etc/etl-craft/ca.pem
    read_only: true
    networks: [edge]
    depends_on: [proxy]
    volumes:
      - agent:/project
      - ./agent.yml:/project/craft-connector.yml:ro
      - ./tls/ca.pem:/etc/etl-craft/ca.pem:ro
    tmpfs: ["/tmp:mode=1777", "/state:uid=10001,gid=10001,mode=0700"]
    healthcheck:
      test: [CMD, etl-craft, agent, health]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 310s

networks:
  backend: {}
  edge:
    ipam:
      config: [{subnet: 172.28.87.0/24}]
volumes:
  engine: {}
  project: {}
  agent: {}
